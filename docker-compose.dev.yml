# Every compose file names its own project, so dev, test and production
# never share containers or volumes. Rename it for a new app.
name: app_dev

services:
  db:
    image: mysql:8.4.11
    # Only the variables MySQL needs, interpolated from the --env-file passed
    # to docker compose, so SECRET_KEY and the Redis password stay out.
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # ping exits 0 whenever the server is up, even if auth fails, so no
      # credentials need to appear in the process list
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    mem_limit: 512m
    cpus: 0.5

  redis:
    image: redis:8.4-alpine
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}  # lets the healthcheck authenticate
    # noeviction and the ACL user: see docker-compose.yml
    command:
      - redis-server
      - --user
      - default
      - "off"
      - --user
      - app
      - "on"
      - ">${REDIS_PASSWORD}"
      - "~refresh_tokens:*"
      - "~LIMITS:*"
      - "+@all"
      - "-@dangerous"
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - noeviction
    healthcheck:
      # redis-cli exits 0 even when AUTH fails, so look for the PONG itself;
      # this also proves the app's credentials work
      test: ["CMD-SHELL", "redis-cli --user app ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    mem_limit: 128m
    cpus: 0.25

volumes:
  db_data:

services:
  db:
    container_name: db_dev
    image: mysql:8.0.44
    env_file:
      - .env.dev
    volumes:
      - db_data_dev:/var/lib/mysql
    healthcheck:
      test: [
        "CMD", "mysqladmin", "ping", 
        "-h", "127.0.0.1", 
        "-u", "root", 
        "-p${MYSQL_ROOT_PASSWORD}"
      ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-network
    ports:
      - "127.0.0.1:3306:3306"
    mem_limit: 512m
    cpus: 0.5

  redis:
    container_name: redis_dev
    image: redis:8.4-alpine
    env_file:
      - .env.dev
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network
    ports:
      - "127.0.0.1:6379:6379"
    mem_limit: 128m
    cpus: 0.25

networks:
  app-network:

volumes:
  db_data_dev:

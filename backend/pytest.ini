[pytest]
# A bare `pytest` runs the unit tests only: the integration tests need the
# services in docker-compose.test.yml (./run_tests.sh integration).
testpaths = tests/unit

# Unknown markers and config keys are errors, and an xfail test that starts
# passing fails, so a typo can never silently disable a test.
strict = true

# A deprecation today is a breaking change in the next major release; fail
# now, while the fix is small. Ignore a specific warning here, with a reason,
# only when it cannot be fixed.
filterwarnings =
    error

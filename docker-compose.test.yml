# Every compose file names its own project, so dev, test and production
# never share containers or volumes. Rename it for a new app.
name: app_test

services:
  db:
    image: mysql:8.4.11
    # Only the variables MySQL needs, interpolated from the --env-file passed
    # to docker compose, so SECRET_KEY and the Redis password stay out. The
    # keys are the MySQL image's own names; the app reads DB_* everywhere.
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    healthcheck:
      # ping exits 0 whenever the server is up, even if auth fails, so no
      # credentials need to appear in the process list
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: "no"
    ports:
      - "127.0.0.1:3307:3306"
    mem_limit: 512m
    cpus: 0.5
    tmpfs:
      - /var/lib/mysql

  redis:
    image: redis:8.10-alpine
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}  # lets the healthcheck authenticate
    # noeviction and the ACL user: see docker-compose.yml
    command:
      - redis-server
      - --user
      - default
      - "off"
      - --user
      - app
      - "on"
      - ">${REDIS_PASSWORD}"
      - "~refresh_tokens:*"
      - "~LIMITS:*"
      - "+@all"
      - "-@dangerous"
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - noeviction
    healthcheck:
      # redis-cli exits 0 even when AUTH fails, so look for the PONG itself;
      # this also proves the app's credentials work
      test: ["CMD-SHELL", "redis-cli --user app ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: "no"
    ports:
      - "127.0.0.1:6380:6379"
    mem_limit: 128m
    cpus: 0.25

  # Same as docker-compose.yml. One-shot: applies migrations as root, then
  # leaves DB_USER with data rights only (backend/restrict_db_user.py), and
  # exits. The backend starts once it succeeds, holding credentials that
  # cannot change the schema.
  migrate:
    build: ./backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    command: ["sh", "-c", "flask db upgrade && python restrict_db_user.py"]
    environment:
      APP_ENV: integration
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      APP_DB_USER: ${DB_USER}
      REDIS_HOST: redis
      REDIS_USERNAME: app
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
    profiles:
      - e2e

  backend:
    build: ./backend
    # Same hardening as docker-compose.yml, so E2E catches anything it breaks
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    # Only what the app reads, interpolated from --env-file .env.test. Hosts
    # are service names and ports the defaults inside the Docker network.
    environment:
      APP_ENV: integration
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_USERNAME: app
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      # This service only runs for Playwright, which needs the browser-facing
      # cookie settings: Secure cookies and CSRF protection on.
      E2E_MODE: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
    healthcheck:
      # start_period covers the entrypoint's wait-for-services
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    mem_limit: 512m
    cpus: 1.0
    profiles:
      - e2e

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    # Same hardening as docker-compose.yml, so E2E catches anything it breaks
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    environment:
      # The E2E suite logs in and registers many times from one address
      NGINX_AUTH_RATE: 600r/m
    ports:
      - "127.0.0.1:8443:443"
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"
    mem_limit: 256m
    cpus: 0.5
    profiles:
      - e2e

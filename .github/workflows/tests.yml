name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same ref makes an in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # TestingConfig swaps in in-memory SQLite and disables Redis and rate
      # limiting, but the base Config still validates that these are present,
      # so they need placeholder values even though nothing connects.
      FLASK_ENV: testing
      SECRET_KEY: ci-only-not-a-real-secret
      MYSQL_USER: ci
      MYSQL_PASSWORD: ci
      MYSQL_HOST: localhost
      MYSQL_DATABASE: ci
      REDIS_HOST: localhost
      REDIS_DB: "0"
      REDIS_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/unit --cov=app --cov-report=term-missing

  frontend:
    name: Frontend unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:run

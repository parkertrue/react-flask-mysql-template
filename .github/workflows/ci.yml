name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Jobs only read the repository; a compromised step gets no write token.
permissions:
  contents: read

# A newer push to the same ref makes an in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a commit, not a tag: a tag can be moved to point at
# different code. Dependabot keeps the pins (and their comments) current.
jobs:
  backend:
    name: Backend unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # Fails under the coverage floor in backend/.coveragerc
      - name: Run unit tests
        run: pytest tests/unit --cov=app --cov-report=term-missing

  frontend:
    name: Frontend unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Fails under the coverage thresholds in vite.config.js
      - name: Run unit tests
        run: npm run test:coverage

  compose:
    name: Compose files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Catches a broken interpolation, anchor or key in any of the three
      # stacks in seconds; production is checked against the example env file.
      - name: Validate
        run: |
          docker compose --env-file .env.dev -f docker-compose.dev.yml config --quiet
          docker compose --env-file .env.test -f docker-compose.test.yml --profile e2e config --quiet
          docker compose --env-file .env.prod.example config --quiet

  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Security analyzer for .github/ (workflows and dependabot.yml): template
      # injection, credential leaks, over-broad permissions. The read-only
      # token lets its online audits check each pinned action commit against
      # its tag and against known advisories.
      - name: Lint
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run --spec zizmor==1.30.1 zizmor --format=github .

  dockerfiles:
    name: Dockerfiles
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned by digest for the same reason as the actions above. Dependabot
      # does not watch workflow images, so bump this by hand.
      - name: Lint
        run: |
          for f in backend/Dockerfile nginx/Dockerfile; do
            echo "$f"
            docker run --rm -i hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d < "$f"
          done

  nginx:
    name: Nginx config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # nginx/certs/ is gitignored; nginx -T only needs a pair to load.
      - name: Generate self-signed certificates
        run: |
          mkdir -p nginx/certs
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -keyout nginx/certs/privkey.pem \
            -out nginx/certs/fullchain.pem \
            -subj "/CN=localhost"

      # Renders the templates the way the container does at start, in the
      # image nginx/Dockerfile pins, then nginx -T checks the result and dumps
      # it as one file. The NGINX_* values are nginx/Dockerfile's defaults.
      - name: Validate
        run: |
          image=$(sed -n 's/^FROM \(nginx:[^ ]*\).*/\1/p' nginx/Dockerfile)
          docker run --rm \
            -e NGINX_ENTRYPOINT_QUIET_LOGS=1 -e NGINX_ENVSUBST_FILTER='^NGINX_' \
            -e NGINX_SERVER_NAME=example.com \
            -e NGINX_AUTH_RATE=20r/m -e NGINX_API_RATE=30r/s \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro" \
            -v "$PWD/nginx/security_headers.conf:/etc/nginx/security_headers.conf:ro" \
            -v "$PWD/nginx/templates:/etc/nginx/templates:ro" \
            -v "$PWD/nginx/certs:/etc/nginx/certs:ro" \
            "$image" nginx -T > "$RUNNER_TEMP/nginx.conf"

      # Security analyzer (gixy-ng, the maintained fork of Yandex's gixy).
      # Skipped: hsts_header fires on the port-80 redirect server, where
      # browsers ignore HSTS anyway (RFC 6797 8.1), and e2e/nginx.spec.js
      # asserts it over HTTPS; try_files_is_evil_too is a performance opinion
      # that doesn't matter for a few static files.
      - name: Lint
        run: |
          pipx run --spec gixy-ng==0.2.55 gixy \
            --skips hsts_header,try_files_is_evil_too "$RUNNER_TEMP/nginx.conf"

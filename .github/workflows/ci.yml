name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Jobs only read the repository; a compromised step gets no write token.
permissions:
  contents: read

# A newer push to the same ref makes an in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a commit, not a tag: a tag can be moved to point at
# different code. Dependabot keeps the pins (and their comments) current.
jobs:
  backend:
    name: Backend unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # Fails under the coverage floor in backend/.coveragerc
      - name: Run unit tests
        run: pytest tests/unit --cov=app --cov-report=term-missing

  frontend:
    name: Frontend unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Fails under the coverage thresholds in vite.config.js
      - name: Run unit tests
        run: npm run test:coverage

  compose:
    name: Compose files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Catches a broken interpolation, anchor or key in any of the three
      # stacks in seconds; production is checked against the example env file.
      - name: Validate
        run: |
          docker compose --env-file .env.dev -f docker-compose.dev.yml config --quiet
          docker compose --env-file .env.test -f docker-compose.test.yml --profile e2e config --quiet
          docker compose --env-file .env.prod.example config --quiet

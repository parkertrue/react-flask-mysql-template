name: Integration & E2E

# These need Docker (and browsers, for E2E), so they are far slower than the
# unit suites and are not worth running on every commit. Nightly plus on demand.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC daily

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  integration:
    name: Backend integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Start test services
        run: docker compose --env-file .env.test -f docker-compose.test.yml up -d --wait

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run integration tests
        working-directory: backend
        run: |
          set -a && . ../.env.test && set +a
          pytest tests/integration

      - name: Service logs on failure
        if: failure()
        run: docker compose --env-file .env.test -f docker-compose.test.yml logs

      - name: Tear down
        if: always()
        run: docker compose --env-file .env.test -f docker-compose.test.yml down -v

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # nginx/certs/ is gitignored and the e2e stack terminates TLS, so mint a
      # throwaway self-signed pair. Playwright is configured to ignore the
      # resulting cert warnings.
      - name: Generate self-signed certificates
        run: |
          mkdir -p nginx/certs
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
            -keyout nginx/certs/privkey.pem \
            -out nginx/certs/fullchain.pem \
            -subj "/C=US/ST=California/L=San Francisco/O=Dev/CN=localhost"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # playwright.config.js brings the e2e compose profile up itself via its
      # webServer block, and does not reuse an existing server when CI is set.
      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose --env-file .env.test -f docker-compose.test.yml --profile e2e down -v

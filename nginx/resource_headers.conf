# Included by every location that serves something other than the app's page:
# the API, its error bodies, the hashed assets and the favicon. It adds the
# shared security headers, plus a CSP for a response opened directly in a
# tab (an SVG, a JSON error): it may not run scripts, load anything or be
# framed. The page's own scripts and stylesheets ignore it; only the page's
# CSP (the / location) governs what they may do.
include /etc/nginx/security_headers.conf;
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

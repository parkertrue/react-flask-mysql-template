worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # The stack's one access log: the backend logs only events and errors.
    # JSON, like the backend's lines, so one parser reads both; times are in
    # seconds, and upstream_response_time is empty when nginx answered alone.
    log_format json escape=json '{"time":"$time_iso8601","ip":"$remote_addr",'
                    '"method":"$request_method","uri":"$request_uri",'
                    '"protocol":"$server_protocol","status":$status,'
                    '"bytes":$body_bytes_sent,"request_time":$request_time,'
                    '"upstream_response_time":"$upstream_response_time",'
                    '"referer":"$http_referer","user_agent":"$http_user_agent"}';

    access_log /var/log/nginx/access.log json;
    error_log /var/log/nginx/error.log warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    server_tokens off;

    # Rate limiting zones: see templates/00-rate-limits.conf.template

    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Docker's embedded DNS. With "resolve", nginx re-resolves the backend's
    # name, so a recreated backend container with a new IP is picked up
    # without restarting nginx. While a container is being swapped Docker
    # answers "not found", and nginx keeps that answer for `valid`, serving 502s
    # after the new backend is healthy. A lookup there is local and cheap, so
    # keep it short.
    resolver 127.0.0.11 valid=2s ipv6=off;

    upstream backend {
        zone backend 64k;
        server backend:5000 resolve;
        keepalive 32;
        # Below gunicorn's --keep-alive 5, so nginx never reuses a connection
        # gunicorn is closing (a POST on one would fail with a 502)
        keepalive_timeout 4s;
    }

    # Gzip compression. Static files are compressed at build time
    # (nginx/Dockerfile), so gzip_static serves those; gzip covers the rest,
    # mainly API responses.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}

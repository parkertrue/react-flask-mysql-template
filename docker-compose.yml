# Docker's default json-file driver never rotates, so on a long-running
# server container logs grow until the disk fills. Every service uses this.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Applied to every service: no setuid binary can raise a process's privileges.
x-security: &security
  security_opt:
    - no-new-privileges:true

# The backend image needs no capabilities and writes nowhere but gunicorn's
# worker heartbeat files in /tmp. Shared by backend and migrate.
x-backend-hardening: &backend-hardening
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp

# What the app reads, interpolated from --env-file .env.prod, so
# MYSQL_ROOT_PASSWORD stays out. Hosts and FLASK_ENV are fixed by this file.
x-backend-env: &backend-env
  FLASK_ENV: production
  MYSQL_HOST: db
  MYSQL_DATABASE: ${MYSQL_DATABASE}
  MYSQL_USER: ${MYSQL_USER}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD}
  REDIS_HOST: redis
  REDIS_USERNAME: app
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  SECRET_KEY: ${SECRET_KEY}

services:
  db:
    logging: *logging
    <<: *security
    image: mysql:8.4.11
    # Only the variables MySQL needs, interpolated from the --env-file passed
    # to docker compose, so SECRET_KEY and the Redis password stay out.
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # ping exits 0 whenever the server is up, even if auth fails, so no
      # credentials need to appear in the process list
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 40s
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
          pids: 256
        reservations:
          cpus: "0.5"
          memory: 512m

  redis:
    logging: *logging
    <<: *security
    image: redis:8.4-alpine
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}  # lets the healthcheck authenticate
    # Redis holds the refresh-token allowlist and rate-limit counters, so
    # nothing may be evicted: noeviction makes a full Redis fail loudly instead
    # of silently logging users out and resetting limits. maxmemory stays below
    # the container limit to leave room for the AOF rewrite fork.
    # ACL: the built-in "default" user is off; the app's user may touch only
    # its own keys and no @dangerous command (FLUSHALL, CONFIG, KEYS, ...).
    # A list, not one string: compose would read the ">" before the password
    # as a shell redirect and silently drop every argument after it.
    command:
      - redis-server
      - --user
      - default
      - "off"
      - --user
      - app
      - "on"
      - ">${REDIS_PASSWORD}"
      - "~refresh_tokens:*"
      - "~LIMITS:*"
      - "+@all"
      - "-@dangerous"
      - --appendonly
      - "yes"
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    # Time to flush the AOF on SIGTERM. Docker's default grace period is not
    # fixed (Docker Desktop kills after about 1s), so every service sets one.
    stop_grace_period: 10s
    healthcheck:
      # redis-cli exits 0 even when AUTH fails, so look for the PONG itself;
      # this also proves the app's credentials work
      test: ["CMD-SHELL", "redis-cli --user app ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
          pids: 64
        reservations:
          cpus: "0.25"
          memory: 128m

  # One-shot: applies migrations as root, then leaves MYSQL_USER with data
  # rights only (backend/restrict_db_user.py), and exits. The backend starts
  # once it succeeds, holding credentials that cannot change the schema.
  migrate:
    logging: *logging
    <<: [*security, *backend-hardening]
    build: ./backend
    command: ["sh", "-c", "flask db upgrade && python restrict_db_user.py"]
    environment:
      <<: *backend-env
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      APP_MYSQL_USER: ${MYSQL_USER}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
          pids: 64

  backend:
    logging: *logging
    <<: [*security, *backend-hardening]
    build: ./backend
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edge
      - internal
    restart: unless-stopped
    # Longer than gunicorn's --graceful-timeout, so in-flight requests finish
    # before Docker's SIGKILL
    stop_grace_period: 35s
    healthcheck:
      # start_period covers the entrypoint's wait-for-services
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
          pids: 128
        reservations:
          cpus: "0.5"
          memory: 256m

  nginx:
    logging: *logging
    <<: *security
    build:
      context: .
      dockerfile: nginx/Dockerfile
    environment:
      # The domain this deployment serves; requests for any other host are
      # dropped (see nginx/templates/default.conf.template)
      NGINX_SERVER_NAME: ${SERVER_NAME:?set SERVER_NAME in .env.prod}
    # The master process binds 80/443, owns its cache directories, reads the
    # TLS key (mode 600, whoever owns it on the host) and switches workers to
    # the nginx user; nothing else is needed.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    # nginx's SIGQUIT lets in-flight requests finish; match the backend
    stop_grace_period: 35s
    networks:
      - edge
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
          pids: 64
        reservations:
          cpus: "0.25"
          memory: 128m

# nginx reaches only the backend; MySQL and Redis sit on a network with no
# route out of the host, reachable only from the backend.
networks:
  edge:
  internal:
    internal: true

volumes:
  db_data:
  redis_data:
